version: "3.9"

services:
  neo4j:
    image: "${NEO4J_IMAGE:-docker.m.daocloud.io/library/neo4j:5.26-community}"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-skillgraph-password}"
      GRAPH_DB_PASSWORD: "${NEO4J_PASSWORD:-skillgraph-password}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      # Keep seed files in a writable volume; the Neo4j entrypoint chowns its
      # import directory during startup.
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${GRAPH_DB_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j-init:
    image: "${NEO4J_IMAGE:-docker.m.daocloud.io/library/neo4j:5.26-community}"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      GRAPH_DB_PASSWORD: "${NEO4J_PASSWORD:-skillgraph-password}"
    volumes:
      - neo4j_import:/var/lib/neo4j/import
      - ./neo4j:/seed:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      cp /seed/schema.cypher /var/lib/neo4j/import/schema.cypher &&
      cp /seed/seed.cypher /var/lib/neo4j/import/seed.cypher &&
      cypher-shell -a neo4j://neo4j:7687 -u neo4j -p "$${GRAPH_DB_PASSWORD}"
      -f /var/lib/neo4j/import/schema.cypher &&
      cypher-shell -a neo4j://neo4j:7687 -u neo4j -p "$${GRAPH_DB_PASSWORD}"
      -f /var/lib/neo4j/import/seed.cypher
    restart: "no"

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: "${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}"
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-skillgraph-password}"
    ports:
      - "8000:8000"

volumes:
  neo4j_data:
  neo4j_import:
